# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum Go version declared in go.mod.
          - name: go.mod
            go-version-file: go.mod
          - name: stable
            go-version: stable
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: ${{ matrix.go-version-file }}
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  integration:
    name: integration (${{ matrix.mongo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongo: [ "mongo:7.0", "mongo:8.0" ]
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Integration test
      run: go test -v -race ./integration/...
      env:
        KYTE_INTEGRATION_TEST: "true"
        KYTE_MONGO_IMAGE: ${{ matrix.mongo }}
